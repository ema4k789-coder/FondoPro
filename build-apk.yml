
name: Build FondoPro APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar versión actual
    runs-on: ubuntu-latest

    steps:
      - name: Descargar versión actual del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Seleccionar ZIP actualizado
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FondoPro-galeria-corregida.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No existe $ZIP_FILE en la raíz del repositorio."
            echo "ZIP disponibles:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP seleccionado: $ZIP_FILE"
          sha256sum "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -oq "$ZIP_FILE"

          test -f fondopro/capacitor/package.json || {
            echo "::error::El ZIP no contiene fondopro/capacitor/package.json"
            exit 1
          }

          test -f fondopro/capacitor/www/index.html
          test -f fondopro/capacitor/www/app.js

          echo "Versión extraída correctamente."

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar JavaScript
        run: |
          set -euo pipefail
          node --check fondopro/capacitor/www/app.js

      - name: Instalar dependencias
        working-directory: fondopro/capacitor
        run: npm install

      - name: Preparar Android
        working-directory: fondopro/capacitor
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Compilar APK
        working-directory: fondopro/capacitor/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK de esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: FondoPro-APK-run-${{ github.run_number }}
          path: fondopro/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
