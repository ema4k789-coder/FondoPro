name: Build FondoPro APK

on:
push:
paths:
- '**.zip'
- '.github/workflows/build-apk.yml'
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Preparar Android SDK
    uses: android-actions/setup-android@v3

  - name: Extraer proyecto
    shell: bash
    run: |
      set -e
      ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'FondoPro*.zip' | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No se encontró un ZIP FondoPro en la raíz del repositorio."
        ls -la
        exit 1
      fi
      echo "Archivo encontrado: $ZIP_FILE"
      mkdir -p proyecto_extraido
      unzip -oq "$ZIP_FILE" -d proyecto_extraido
      find proyecto_extraido -maxdepth 3 -type f | head -80

  - name: Localizar proyecto Android
    shell: bash
    run: |
      set -e
      if [ -f proyecto_extraido/FondoPro/capacitor/package.json ]; then
        echo "PROJECT_DIR=proyecto_extraido/FondoPro/capacitor" >> "$GITHUB_ENV"
      elif [ -f proyecto_extraido/capacitor/package.json ]; then
        echo "PROJECT_DIR=proyecto_extraido/capacitor" >> "$GITHUB_ENV"
      elif [ -f proyecto_extraido/package.json ]; then
        echo "PROJECT_DIR=proyecto_extraido" >> "$GITHUB_ENV"
      else
        echo "ERROR: No se encontró package.json en las ubicaciones esperadas."
        find proyecto_extraido -name package.json -o -name capacitor.config.json
        exit 1
      fi

  - name: Instalar dependencias
    run: |
      cd "$PROJECT_DIR"
      npm install

  - name: Preparar proyecto Android
    run: |
      cd "$PROJECT_DIR"
      npx cap sync android
      if [ ! -d android ]; then
        echo "ERROR: Capacitor no generó la carpeta android."
        exit 1
      fi

  - name: Compilar APK
    run: |
      cd "$PROJECT_DIR/android"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: FondoPro-APK
      path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
