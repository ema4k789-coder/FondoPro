
name: Build FondoPro APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'FondoPro-editor-integral-corregido.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar y extraer ZIP de FondoPro
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FondoPro-editor-integral-corregido.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró $ZIP_FILE en la raíz del repositorio."
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Verificando integridad del ZIP..."
          unzip -t "$ZIP_FILE"

          echo "Extrayendo proyecto..."
          unzip -oq "$ZIP_FILE"

          if [ ! -f "fondopro/capacitor/package.json" ]; then
            echo "::error::No se encontró fondopro/capacitor/package.json."
            find . -maxdepth 6 -name package.json -print
            exit 1
          fi

          if [ ! -f "fondopro/app.js" ] || [ ! -f "fondopro/capacitor/www/app.js" ]; then
            echo "::error::Falta app.js en una de las carpetas."
            exit 1
          fi

          if ! cmp -s "fondopro/app.js" "fondopro/capacitor/www/app.js"; then
            echo "::error::Los archivos app.js no coinciden."
            exit 1
          fi

          echo "Proyecto extraído y archivos verificados."

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check fondopro/app.js
          node --check fondopro/capacitor/www/app.js

      - name: Instalar dependencias de Capacitor
        working-directory: fondopro/capacitor
        run: npm install

      - name: Preparar proyecto Android
        working-directory: fondopro/capacitor
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Verificar archivos de Gradle
        working-directory: fondopro/capacitor/android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::No se encontró gradlew."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Falta gradle/wrapper/gradle-wrapper.properties."
            exit 1
          fi

          chmod +x gradlew
          echo "Archivos de Gradle encontrados."

      - name: Compilar APK de depuración
        working-directory: fondopro/capacitor/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug

      - name: Verificar APK generado
        shell: bash
        run: |
          set -euo pipefail

          APK="fondopro/capacitor/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::No se generó el APK esperado."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generado correctamente."

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FondoPro-debug-APK
          path: fondopro/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
