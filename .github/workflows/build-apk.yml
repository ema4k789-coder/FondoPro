
name: Build FondoPro APK

'on':
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extraer FondoPro
        shell: bash
        run: |
          set -e
          ZIP_FILE="FondoPro-mejoras-completas.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "No se encontro el ZIP requerido"
            exit 1
          fi

          unzip -oq "$ZIP_FILE"

          if [ ! -f "fondopro/capacitor/package.json" ]; then
            echo "No se encontro package.json"
            find . -maxdepth 5 -name package.json
            exit 1
          fi

      - name: Instalar dependencias
        working-directory: fondopro/capacitor
        run: |
          npm install

      - name: Preparar Android
        working-directory: fondopro/capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK
        working-directory: fondopro/capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FondoPro-debug-APK
          path: fondopro/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
